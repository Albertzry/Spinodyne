version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: spinodyne-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: spinodyne
      POSTGRES_USER: spinodyne
      POSTGRES_PASSWORD: spinodyne
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: spinodyne-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  minio:
    image: minio/minio:RELEASE.2024-12-18T06-46-26Z
    container_name: spinodyne-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123456
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  redis_data:
  minio_data:
