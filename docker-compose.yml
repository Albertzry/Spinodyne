services:
  spinodyne:
    build:
      context: .
      dockerfile: Dockerfile
    image: spinodyne:latest
    container_name: spinodyne
    restart: unless-stopped

    # GPU access
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

    ports:
      # Frontend
      - "25433:25433"
      # Backend API
      - "25546:25546"
      # MinIO
      - "25772:25772"

    volumes:
      # Persist PostgreSQL data across container restarts
      - pg_data:/var/lib/postgresql/12/main
      # Persist MinIO data
      - minio_data:/data/minio
      # Persist temporary uploads during processing
      - upload_data:/root/Spinodyne/backend/data/uploads

    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - TOTALSPINESEG_DATA=/opt/data/private/data_sum

volumes:
  pg_data:
  minio_data:
  upload_data:
