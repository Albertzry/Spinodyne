name: spinodyne

services:
  postgres:
    image: spinodyne-postgres:v0.1.0-beta.1
    container_name: spinodyne_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: spinodyne
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d spinodyne"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: spinodyne-redis:v0.1.0-beta.1
    container_name: spinodyne_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: spinodyne-minio:v0.1.0-beta.1
    container_name: spinodyne_minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: spinodyne-backend:v0.1.0-beta.1
    platform: linux/amd64
    gpus: all
    container_name: spinodyne_backend
    restart: unless-stopped
    environment:
      CONFIG_FILE: /app/config.json
      TOTALSPINESEG_DATA: /app/model/weights
      TSS_MAX_WORKERS: "${TSS_MAX_WORKERS:-12}"
      TSS_MAX_WORKERS_NNUNET: "${TSS_MAX_WORKERS_NNUNET:-2}"
      TOTALSPINESEG_DEVICE: "cuda"
      NVIDIA_VISIBLE_DEVICES: "all"
      NVIDIA_DRIVER_CAPABILITIES: "compute,utility"
    shm_size: "8gb"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - ./config.json:/app/config.json:ro
    ports:
      - "25025:25025"
    command: ["api"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:25025/docs"]
      interval: 15s
      timeout: 5s
      retries: 20

  celery_worker:
    image: spinodyne-backend:v0.1.0-beta.1
    platform: linux/amd64
    gpus: all
    container_name: spinodyne_celery_worker
    restart: unless-stopped
    environment:
      CONFIG_FILE: /app/config.json
      TOTALSPINESEG_DATA: /app/model/weights
      TSS_MAX_WORKERS: "${TSS_MAX_WORKERS:-12}"
      TSS_MAX_WORKERS_NNUNET: "${TSS_MAX_WORKERS_NNUNET:-2}"
      TOTALSPINESEG_DEVICE: "cuda"
      NVIDIA_VISIBLE_DEVICES: "all"
      NVIDIA_DRIVER_CAPABILITIES: "compute,utility"
      RUN_DB_INIT: "0"
    shm_size: "8gb"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      backend:
        condition: service_healthy
    volumes:
      - ./config.json:/app/config.json:ro
    command: ["worker"]
    healthcheck:
      test: ["CMD-SHELL", "conda run --no-capture-output -n tss celery -A app.worker.celery_app inspect ping -d celery@$$HOSTNAME || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    image: spinodyne-frontend:v0.1.0-beta.1
    platform: linux/amd64
    container_name: spinodyne_frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "25595:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
  redis_data:
  minio_data:
