services:
  postgres:
    image: spinodyne-postgres:v0.1.0-beta.1
    container_name: spinodyne_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: spinodyne
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d spinodyne"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: spinodyne-redis:v0.1.0-beta.1
    container_name: spinodyne_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: spinodyne-minio:v0.1.0-beta.1
    container_name: spinodyne_minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: spinodyne-backend:v0.1.0-beta.1
    platform: linux/amd64
    container_name: spinodyne_backend
    restart: unless-stopped
    environment:
      CONFIG_FILE: /app/config.json
      TOTALSPINESEG_DATA: /app/model/weights
      TSS_MAX_WORKERS: "2"
      TSS_MAX_WORKERS_NNUNET: "1"
    shm_size: "8gb"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    volumes:
      - ./config.json:/app/config.json:ro
    ports:
      - "25025:25025"
    command: ["api"]

  celery_worker:
    image: spinodyne-backend:v0.1.0-beta.1
    platform: linux/amd64
    container_name: spinodyne_celery_worker
    restart: unless-stopped
    environment:
      CONFIG_FILE: /app/config.json
      TOTALSPINESEG_DATA: /app/model/weights
      TSS_MAX_WORKERS: "2"
      TSS_MAX_WORKERS_NNUNET: "1"
    shm_size: "8gb"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
      backend:
        condition: service_started
    volumes:
      - ./config.json:/app/config.json:ro
    command: ["worker"]

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    image: spinodyne-frontend:v0.1.0-beta.1
    platform: linux/amd64
    container_name: spinodyne_frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
    ports:
      - "25595:80"

volumes:
  postgres_data:
  redis_data:
  minio_data:
